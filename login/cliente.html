<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Login do cliente no BarberHub" />

    <meta name="theme-color" content="#D4AF37" />

    <title>Login do Cliente | BarberHub</title>

    <link rel="icon" type="image/png" href="../assets/barber.png" />

    <link rel="stylesheet" href="../login/style.css" />
  </head>

  <body>
    <main id="tela-boas-vindas">
      <section class="tbv-container">
        <div class="tbv-box">
          <header class="box-header">
            <img
              src="../assets/barber.png"
              alt="Logo BarberHub"
              class="bv-logo"
            />

            <h1 class="bv-titulo">Entrar</h1>

            <p class="bv-subtitulo">
              Entre na sua conta para agendar seu horário
            </p>
          </header>

          <div class="bv-divisor" aria-hidden="true"></div>

          <form id="form-login" novalidate>
            <div class="campo">
              <label for="email"> E-mail </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="seu@email.com"
                autocomplete="email"
                inputmode="email"
                maxlength="254"
                required
              />
            </div>

            <div class="campo">
              <label for="senha"> Senha </label>

              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="btn-esqueci-senha"
                onclick="esqueciSenha()"
              >
                Esqueci minha senha
              </button>
            </div>

            <p id="mensagem" aria-live="polite" role="status"></p>

            <button type="submit" class="btn-principal">Entrar</button>

            <button type="button" class="btn-voltar" onclick="irParaCadastro()">
              Ainda não tenho conta
            </button>

            <button type="button" class="btn-voltar" onclick="voltar()">
              💈 Voltar ao início
            </button>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../config.js"></script>

    <script src="cliente.js"></script>
  </body>
</html>
