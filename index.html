<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BarberHub - Encontre as melhores barbearias da sua cidade, veja serviços, preços e agende seu horário."
    />
    <meta name="theme-color" content="#D4AF37" />

    <title>BarberHub | Gestão e agendamento</title>

    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main id="tela-boas-vindas">
      <section class="tbv-container">
        <div class="tbv-box">
          <div class="bv-logo-container">
            <img
              src="./assets/barber.png"
              alt="Logo do BarberHub"
              class="bv-logo"
            />
          </div>

          <h1 id="titulo-principal" class="bv-titulo">
            Bem-vindo ao BarberHub!
          </h1>

          <p class="bv-subtitulo">Gestão inteligente para barbearias</p>

          <div class="bv-divisor" aria-hidden="true"></div>

          <p class="bv-descricao">
            Organize sua barbearia, gerencie seus clientes e acompanhe seu
            negócio em um só lugar.
          </p>

          <div class="bv-features" aria-label="Diferenciais do BarberHub">
            <div class="bv-feature">
              <span class="bv-icon" aria-hidden="true"> 📅 </span>

              <span>Agendamento online</span>
            </div>

            <div class="bv-feature">
              <span class="bv-icon" aria-hidden="true"> 💈 </span>

              <span>Gestão de barbeiros</span>
            </div>

            <div class="bv-feature">
              <span class="bv-icon" aria-hidden="true"> 👥 </span>

              <span>Gestão de clientes</span>
            </div>
          </div>

          <div class="bv-opcoes">
            <button
              id="btn-barbearia"
              class="bv-btn"
              type="button"
              data-destino="barbearia"
            >
              💈 Acessar como Barbearia
            </button>

            <button
              id="btn-cliente"
              class="bv-btn"
              type="button"
              data-destino="cliente"
            >
              👤 Acessar como Cliente
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
